name: Publish APK to GitHub Packages

# Publishes each release's signed APK to the repo's GitHub Packages (Maven)
# registry, so the built app is discoverable under the "Packages" tab as
# online.k73:bmw-launcher:<version>. Uses the Actions GITHUB_TOKEN, which has
# packages:write — no personal token / extra scope needed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.5.7)"
        required: true
        default: "v1.5.7"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: t
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Download APK asset from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.t.outputs.tag }}" -R "${{ github.repository }}" -p '*.apk' -D dist

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Publish APK to GitHub Packages (Maven)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER="${{ steps.t.outputs.tag }}"; VER="${VER#v}"
          APK="$(ls dist/*.apk | head -1)"
          echo "Publishing $APK as online.k73:bmw-launcher:$VER"
          cat > settings.xml <<XML
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          mvn -B --no-transfer-progress deploy:deploy-file \
            -DgroupId=online.k73 \
            -DartifactId=bmw-launcher \
            -Dversion="$VER" \
            -Dpackaging=apk \
            -Dfile="$APK" \
            -DgeneratePom=true \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${{ github.repository }}" \
            -s settings.xml
